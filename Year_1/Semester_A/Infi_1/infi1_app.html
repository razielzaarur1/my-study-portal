<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>אינפי 1</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <script src="infi1_questions.js"></script>
    
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --accent: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Rubik', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            padding-bottom: 80px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        /* כפתור חזרה שיוצא 3 תיקיות אחורה ל-index.html */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            color: #64748b;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        
        .back-btn:hover { background: #f1f5f9; }

        h1 { margin: 0; font-size: 1.8rem; color: var(--primary); }

        /* כרטיס AI */
        .ai-card {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            color: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
            text-decoration: none;
            transition: transform 0.2s;
        }

        .ai-card:active { transform: scale(0.98); }

        .ai-content h3 { margin: 0 0 5px 0; font-size: 1.1rem; }
        .ai-content p { margin: 0; opacity: 0.9; font-size: 0.85rem; font-weight: 300; }
        
        .ai-icon {
            font-size: 1.8rem;
            background: rgba(255,255,255,0.2);
            width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px;
            flex-shrink: 0;
            margin-right: 15px;
        }

        /* רשימת השאלות */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid #e2e8f0;
        }

        .meta {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .question-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #334155;
        }

        /* מצב טעינה/שגיאה */
        .status-msg {
            text-align: center;
            color: #94a3b8;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="../../../index.html" class="back-btn">
            <i class="fas fa-arrow-right"></i> חזרה לפורטל
        </a>
        <h1>אינפי 1 (חדו"א)</h1>
    </div>

    <a href="https://notebooklm.google.com/notebook/d8805bdc-8f74-4b6d-bdaf-f70833110acc" target="_blank" class="ai-card">
        <div class="ai-content">
            <h3><i class="fas fa-sparkles"></i> המחברת החכמה (AI)</h3>
            <p>צ'אט על החומר, סיכומים ופתרונות מלאים</p>
        </div>
        <div class="ai-icon"><i class="fas fa-robot"></i></div>
    </a>

    <div id="questions-container">
        <div class="status-msg">
            <i class="fas fa-circle-notch fa-spin"></i> טוען שאלות...
        </div>
    </div>

    <script>
        const container = document.getElementById('questions-container');
        
        // בדיקה שהקובץ infi1_questions.js נטען בהצלחה
        if (typeof questionsData === 'undefined') {
            container.innerHTML = `
                <div class="status-msg" style="color: #ef4444;">
                    <i class="fas fa-exclamation-circle fa-2x"></i><br><br>
                    שגיאה בטעינת הקובץ <b>infi1_questions.js</b><br>
                    ודא שהקובץ קיים באותה תיקייה ושמו תקין.
                </div>`;
        } else {
            container.innerHTML = ''; // ניקוי הודעת טעינה
            
            questionsData.forEach(q => {
                // המרת רמת קושי לעברית/עיצוב
                let difficultyText = q.difficulty === 'hard' ? 'קשה' : (q.difficulty === 'medium' ? 'בינוני' : 'קל');
                let difficultyColor = q.difficulty === 'hard' ? '#fee2e2; color:#991b1b' : '#dbeafe; color:#1e40af';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="meta">
                        <span><i class="far fa-calendar-alt"></i> ${q.source}</span>
                        <span class="badge" style="background:${difficultyColor}">${difficultyText}</span>
                    </div>
                    <div class="question-text">${q.text}</div>
                `;
                container.appendChild(card);
            });
            
            // הפעלת MathJax לרינדור נוסחאות
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }
    </script>

</body>
</html>
