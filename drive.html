<head>
    <meta charset="UTF-8">

    <title>דרייב חשמל - לזכרו של אופיר צרפתי ז"ל | פורטל למידה</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>

        body {
            font-family: 'Heebo', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;

        /* עיצוב פס גלילה מותאם אישית */

<body class="text-slate-800">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const IconBase = ({ children, size = 24, className = "" }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            {children}
          </svg>
        );

        const Folder = (props) => <IconBase {...props}><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></IconBase>;
        const File = (props) => <IconBase {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></IconBase>;
        const Download = (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></IconBase>;
        const AlertCircle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconBase>;
        const ChevronRight = (props) => <IconBase {...props}><path d="m9 18 6-6-6-6"/></IconBase>;
        const FileText = (props) => <IconBase {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></IconBase>;
        const ImageIcon = (props) => <IconBase {...props}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></IconBase>;
        const Loader2 = (props) => <IconBase {...props}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></IconBase>;
        const Eye = (props) => <IconBase {...props}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></IconBase>;
        const X = (props) => <IconBase {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>;
        const Home = (props) => <IconBase {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></IconBase>;
        const LinkIcon = (props) => <IconBase {...props}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></IconBase>;

        // הטמעת הטוקן שביקשת
        const ENCODED_TOKEN = "c2wudS5BR1Z6VXdxby1DQmtKOGFvWU9IZEQtVEt5dFI3ZkpBOXVTUzlpdG5BWDR4VnFNanVyNUI3RjNobTBEMDdqOUJRMzdVMnJxWFBXWFRONHFLcm1rUGpHY3AxZnFKMW14VDNiMU9MX2hmRjh3cmlBcTVQY3VjUi1XV2xmc0FkQzRjcXVsVUFCTjVJRE94OXdvT3RtQUFCT2pPQ2JLVE5QOHFQNTNIRWxOMHJQRlJ2cGNiRkFTY1ZuWkxLYVlEbGJPM2gtaEtBMWM2ODU1VkJraGp5alROS0ZYZ00yZGh1cklsbUNzT1dGa0I2d2w4NGduOW9lVUhBWjRXYmI0ck01ZUtpSWtmcnJmNHhMX055NHdLcmM2eUZ2dTR5T1FKVEFKY1NmM3NLRGc5dlV1N1BxTnBCejlWc0VuN3JFbEJvRVgxMVdrRnZ4UFpZR01LR0JXOVZMRmpWS0N0V29NbXBCVGgzeFp3TEt2U3ZxZThBNFZJLWs0d3dyLUw4eG05WlJVZndwX0JmVkRJWEN0aG5uRXBKY0Y4eVFLVXc2alNRelkxSmpRZ09JcEtaWlZkeE1zVXFRZmo1YmgzOWo4NGJmTVdVWS16Rmt6R1ZIU2lFSVRqOWxtUWxhcnZDNmRIcUstN3NvWWNDdUNSZGJna2FleHRRTl9MVFh5SWtNelhYT3J3YUtWd1JSZXpXT3FkY0hNUXAtTzN5TEVoUHBqdm5vbktNcnctVjVXUW8zaTdlYnRac0ZScEFYTDhYemRLRHozTjZ0MU1OY2U2RXNnRGFwNWktM0dLYzNzVDk4TVlKV2dySnNKaXhzSGlTbzUtT2JhNjB2VUFVc2JXdXlrTWFZZEQyMGJFYkRkeDc5U2pxeWVzWVZvSm9UNlY1TEh5cnNoaFhocFhkSzAyREpOZlV0a0lnS0dZOXF4dzZwRE1aRVRydzEzeHdXYUFuZmJKdUFsdWRJVXJGYmtNNnBmclJLRnk3anA5cndEN2t2V21TQ3pPWFVDU0szMEpIVFJRSmk1Z1FvRTB6NHh1cVIyWGJoVFNIOWVkaVRqbWU0a0FvT0RSeHpOWWg1amgxM0tENU1UZ25CS2FRb0NIc3FJUlBYb1BFRVd1cFowb3ZqNGRmTXNSZnZMOHVqSG5SWWlKVUpoZ1ljaHBhV2d6V0RQT0VqSC11cnNkb2gyVk02YXN4dGlYTWU0MTc5cXlhQXBTR3FibTJiWE1LV25qYlBxNDY5X0xnbW1fYkMwZWVVSldkbWRVdmUybW1VR0ZTM0dkdVAtbXBLbEVZZnkwdUpNbnNnbjI4V0d3UHN4RkJCQzdsQ0U5MmtEMFV2R1NYMWhSRDdjMWU5MTBpaldsWHdoU1huU2hpMUZkZzBscW1aNFZJZ1NxUk9ndjFqclA3ckJiRnRaMXhQQVZZMHA4WEN4eDFObGdCeHFENV9aQzU5ZWwtU1JfR2xZUW05Wm4wcU1FVFItY29samUxcHFGZnJpTW55c244MFhGVlo4WnU5aHpsUGFyUU03M2V6SEpfc3hxSHhsazZvVUE4dXp2dThlRjl3dFIzQ3l0SG0yQXB3VGxsZXpXdnZMSk16azNmY2FNNzBFS21qVnVNRTNIZWNRNDlnVjlUbHctRHJmdVVMTlBST0NyYmN0RTQwa1dVUF94dm51NTBaV3lDS3ItRnhZR0ZQZ2xQcnZ4eklhb3Q0VHNLLXBrUmhwdlQ1TVhsUE91Sk9Rd0lOWGxyaVRkTA==";

        function App() {
          const [token] = useState(() => {
            try {
              return ENCODED_TOKEN ? atob(ENCODED_TOKEN) : '';
            } catch(e) {
              return '';
            }
          });

          const [files, setFiles] = useState([]);
          const [loading, setLoading] = useState(false);
          const [error, setError] = useState('');
          const [currentPath, setCurrentPath] = useState(''); 
          const [pathHistory, setPathHistory] = useState([]); 
          const [viewingFile, setViewingFile] = useState(null); 

          const [previewLoading, setPreviewLoading] = useState(false);
          const [blobUrl, setBlobUrl] = useState(null);

          // הקישור המעודכן לדרייב
          const defaultSharedUrl = "https://www.dropbox.com/scl/fo/zphfxu4bhikj1c8ysr34e/AIqTb6VVSHxzpm6o0rhXV3U/%D7%93%D7%A8%D7%99%D7%99%D7%91%20%D7%9C%D7%96%D7%9B%D7%A8%D7%95%20%D7%A9%D7%9C%20%D7%90%D7%95%D7%A4%D7%99%D7%A8%20%D7%A6%D7%A8%D7%A4%D7%AA%D7%99%20%D7%96%22%D7%9C?dl=0&rlkey=qebczewg33yfi1n88jjxbmbok&subfolder_nav_tracking=1";

          const fetchDropboxFiles = useCallback(async (pathToFetch = "") => {
            if (!token) return;

            setLoading(true);
            setError('');

            try {
              const response = await fetch('https://api.dropboxapi.com/2/files/list_folder', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${token}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  path: pathToFetch,
                  shared_link: { url: defaultSharedUrl },
                  include_mounted_folders: true,
                  include_non_downloadable_files: true
                })
              });

              const data = await response.json();

              if (!response.ok) {
                throw new Error(data.error_summary || 'שגיאה בהתחברות ל-Dropbox API');
              }

              const sortedEntries = data.entries.sort((a, b) => {
                if (a['.tag'] === 'folder' && b['.tag'] === 'file') return -1;
                if (a['.tag'] === 'file' && b['.tag'] === 'folder') return 1;
                return a.name.localeCompare(b.name);
              });

              setFiles(sortedEntries);
              setCurrentPath(pathToFetch);
            } catch (err) {
              setError(err.message);
            } finally {
              setLoading(false);
            }
          }, [token]);

          useEffect(() => {
            if (token) {
              fetchDropboxFiles("");
            }
          }, [token, fetchDropboxFiles]);

          const handleFolderClick = (folderData) => {
            setPathHistory([...pathHistory, currentPath]);
            const newPath = currentPath === "" 
                ? `/${folderData.name}` 
                : `${currentPath}/${folderData.name}`;
            fetchDropboxFiles(newPath);
          };

          const handleBackClick = () => {
            const previousPath = pathHistory[pathHistory.length - 1];
            const newHistory = pathHistory.slice(0, -1);
            setPathHistory(newHistory);
            fetchDropboxFiles(previousPath);
          };

          const getFileIcon = (filename) => {
            const ext = filename.split('.').pop().toLowerCase();
            if (['jpg', 'png', 'gif', 'jpeg'].includes(ext)) return <ImageIcon className="text-purple-500" size={24} />;
            if (['pdf'].includes(ext)) return <FileText className="text-red-500" size={24} />;
            return <File className="text-slate-400" size={24} />;
          };

          const getDownloadUrl = (file) => {
            const filePath = currentPath === "" ? `/${file.name}` : `${currentPath}/${file.name}`;
            try {
              const urlObj = new URL(defaultSharedUrl);
              urlObj.searchParams.set('path', filePath);
              urlObj.searchParams.set('dl', '0'); 
              return urlObj.toString();
            } catch (e) {
              return defaultSharedUrl; 
            }
          };

          const getRawFileUrl = (file) => {
            const filePath = currentPath === "" ? `/${file.name}` : `${currentPath}/${file.name}`;
            try {
              const urlObj = new URL(defaultSharedUrl);
              urlObj.searchParams.set('path', filePath);
              urlObj.searchParams.set('raw', '1'); 
              urlObj.searchParams.delete('dl');
              return urlObj.toString();
            } catch (e) {
              return defaultSharedUrl; 
            }
          };

          useEffect(() => {
            let currentBlobUrl = null;

            const loadFileIntoMemory = async () => {
              if (!viewingFile || !token) return;
              
              const ext = viewingFile.name.split('.').pop().toLowerCase();
              
              if (ext === 'pdf') {
                setPreviewLoading(true);
                try {
                  const filePath = currentPath === "" ? `/${viewingFile.name}` : `${currentPath}/${viewingFile.name}`;
                  
                  const apiArgObj = {
                    url: defaultSharedUrl,
                    path: filePath
                  };
                  
                  const apiArgEncoded = JSON.stringify(apiArgObj).replace(/[\u007F-\uFFFF]/g, function(chr) {
                    return "\\u" + ("0000" + chr.charCodeAt(0).toString(16)).slice(-4);
                  });

                  const response = await fetch('https://content.dropboxapi.com/2/sharing/get_shared_link_file', {
                    method: 'POST',
                    headers: {
                      'Authorization': `Bearer ${token}`,
                      'Dropbox-API-Arg': apiArgEncoded 
                    }
                  });

                  if (!response.ok) throw new Error('שגיאה בטעינת הקובץ מהשרת');
                  
                  const blob = await response.blob();
                  const pdfBlob = new Blob([blob], { type: 'application/pdf' });
                  currentBlobUrl = URL.createObjectURL(pdfBlob); 
                  
                  setBlobUrl(currentBlobUrl);
                } catch (err) {
                  console.error("שגיאה בטעינת הקובץ:", err);
                } finally {
                  setPreviewLoading(false);
                }
              } else {
                setBlobUrl(null);
              }
            };

            loadFileIntoMemory();

            return () => {
              if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
              }
            };
          }, [viewingFile, token, currentPath]);

          const handleCloseFile = () => {
            if (blobUrl) {
              URL.revokeObjectURL(blobUrl); 
            }
            setViewingFile(null);
            setBlobUrl(null);
            setPreviewLoading(false);
          };

          if (!token) {
            return (
              <div className="min-h-screen flex items-center justify-center p-4 bg-slate-50">
                 <div className="bg-white p-8 rounded-2xl shadow-md border border-slate-200 text-center max-w-md w-full">
                    <AlertCircle size={64} className="mx-auto mb-6 text-amber-500" />
                    <h2 className="text-2xl font-bold mb-3 text-slate-800">חסר טוקן התחברות</h2>
                    <p className="text-slate-600 mb-6 leading-relaxed">
                      כדי שהאתר יפעל, יש להמיר את ה-Access Token שלך ל-Base64 ולהזין אותו בקוד המקור תחת המשתנה <code>ENCODED_TOKEN</code>.
                    </p>
                 </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen flex flex-col bg-slate-50">
              
              {/* סרגל ניווט עליון */}
              <header className="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-30">
                <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                  <div className="flex items-center">
                    <a href="index.html" className="text-slate-600 hover:text-blue-600 hover:bg-blue-50 p-2 md:px-4 rounded-lg transition-colors flex items-center gap-2 font-medium" title="חזרה לעמוד הראשי">
                      <Home size={22} />
                      <span className="hidden sm:inline">עמוד הבית</span>
                    </a>
                  </div>
                </div>
              </header>

              <main className="flex-1 p-4 md:p-8 w-full max-w-7xl mx-auto mt-4">
                <div className="space-y-6">
                  
                  {error && (
                    <div className="bg-red-50 text-red-700 p-4 rounded-xl border border-red-200 flex items-start gap-3 shadow-sm">
                      <AlertCircle size={20} className="mt-0.5 shrink-0" />
                      <div className="text-sm font-medium">{error}</div>
                    </div>
                  )}

                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="bg-slate-100 border-b border-slate-200 p-4 flex items-center justify-between flex-wrap gap-4">
                       <div className="flex items-center gap-3">
                          {pathHistory.length > 0 && (
                            <button 
                              onClick={handleBackClick}
                              className="p-1.5 hover:bg-slate-200 rounded-md transition-colors text-slate-600 flex items-center gap-1 text-sm font-medium"
                            >
                              <ChevronRight size={18} />
                              חזור
                            </button>
                          )}
                          <div className="font-semibold text-slate-700 flex items-center gap-2 text-lg">
                            <Folder size={20} className="text-blue-500" />
                            דרייב חשמל - לזכר אופיר צרפתי ז"ל
                            {currentPath && <span className="text-slate-400 font-normal truncate" dir="ltr">{currentPath}</span>}
                          </div>
                       </div>
                       
                       <a 
                          href={defaultSharedUrl} 
                          target="_blank" 
                          rel="noopener noreferrer" 
                          className="flex items-center gap-2 text-sm text-blue-600 bg-blue-50 hover:bg-blue-100 px-4 py-2 rounded-lg transition-colors font-medium shadow-sm"
                       >
                         <LinkIcon size={16} />
                         <span>פתח בדרייב</span>
                       </a>
                    </div>

                    <div className="divide-y divide-slate-100 min-h-[300px]">
                      {loading ? (
                        <div className="flex flex-col items-center justify-center h-64 text-slate-400">
                          <Loader2 size={40} className="animate-spin mb-4 text-blue-500" />
                          <p>מושך נתונים מ-Dropbox...</p>
                        </div>
                      ) : files.length === 0 && !error ? (
                        <div className="flex items-center justify-center h-64 text-slate-400">
                          <p>התיקייה ריקה.</p>
                        </div>
                      ) : (
                        <ul className="max-h-[600px] overflow-y-auto">
                          {files.map((item) => (
                            <li key={item.id} className="group hover:bg-blue-50 transition-colors">
                              {item['.tag'] === 'folder' ? (
                                <button 
                                  onClick={() => handleFolderClick(item)}
                                  className="w-full flex items-center p-4 text-right cursor-pointer focus:outline-none focus:bg-blue-50"
                                >
                                  <div className="bg-blue-100 p-2 rounded-lg text-blue-600 ml-4">
                                    <Folder size={24} />
                                  </div>
                                  <span className="font-medium text-slate-700 flex-1">{item.name}</span>
                                  <ChevronRight size={20} className="text-slate-300 group-hover:text-blue-500 transition-colors rotate-180" />
                                </button>
                              ) : (
                                <div className="w-full flex items-center p-4 text-right hover:bg-slate-50 transition-colors">
                                  <div className="bg-slate-100 p-2 rounded-lg ml-4 shrink-0">
                                    {getFileIcon(item.name)}
                                  </div>
                                  
                                  <div 
                                    className="flex-1 cursor-pointer" 
                                    onClick={() => setViewingFile(item)}
                                  >
                                    <span className="font-medium text-slate-700 block hover:text-blue-600 transition-colors">{item.name}</span>
                                    <span className="text-xs text-slate-400">
                                      {(item.size / 1024 / 1024).toFixed(2)} MB
                                    </span>
                                  </div>
                                  
                                  <div className="flex items-center gap-1 shrink-0">
                                    <button
                                      onClick={() => setViewingFile(item)}
                                      className="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-100 rounded-full transition-colors"
                                      title="הצג קובץ באתר"
                                    >
                                      <Eye size={20} />
                                    </button>

                                    <a 
                                      href={getDownloadUrl(item)}
                                      target="_blank"
                                      rel="noopener noreferrer"
                                      className="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-100 rounded-full transition-colors"
                                      title="לפתיחה בדרופבוקס"
                                    >
                                      <Download size={20} />
                                    </a>
                                  </div>
                                </div>
                              )}
                            </li>
                          ))}
                        </ul>
                      )}
                    </div>
                  </div>
                </div>
              </main>

              {viewingFile && (
                <div className="fixed inset-0 bg-slate-900/80 z-50 flex flex-col p-2 md:p-8 animate-in fade-in duration-200">
                  <div className="bg-white rounded-t-xl p-4 flex justify-between items-center shadow-sm max-w-6xl w-full mx-auto">
                    <div className="flex items-center gap-3 overflow-hidden">
                      <div className="shrink-0">{getFileIcon(viewingFile.name)}</div>
                      <h3 className="font-bold text-slate-800 text-lg truncate" dir="auto">
                        {viewingFile.name}
                      </h3>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      <a 
                        href={getDownloadUrl(viewingFile)} 
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="flex items-center gap-2 text-sm bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-2 rounded-lg transition-colors font-medium"
                      >
                        <Download size={16} />
                        <span className="hidden sm:inline">פתיחה בדרופבוקס</span>
                      </a>
                      <button 
                        onClick={handleCloseFile}
                        className="p-2 text-slate-500 hover:bg-red-50 hover:text-red-500 rounded-lg transition-colors"
                      >
                        <X size={24} />
                      </button>
                    </div>
                  </div>
                  
                  <div className="flex-1 bg-slate-200 rounded-b-xl overflow-hidden relative max-w-6xl w-full mx-auto border-t border-slate-200 shadow-xl flex items-center justify-center">
                    {(() => {
                      const ext = viewingFile.name.split('.').pop().toLowerCase();
                      const isImage = ['jpg', 'png', 'gif', 'jpeg', 'webp'].includes(ext);
                      const isPdf = ext === 'pdf';
                      const rawUrl = getRawFileUrl(viewingFile);

                      if (isImage) {
                        return (
                          <div className="w-full h-full p-4 flex items-center justify-center bg-slate-800">
                            <img src={rawUrl} alt={viewingFile.name} className="max-w-full max-h-full object-contain shadow-md" />
                          </div>
                        );
                      } else if (isPdf) {
                        if (previewLoading) {
                          return (
                            <div className="flex flex-col items-center justify-center text-slate-500 p-8 text-center w-full h-full bg-slate-50">
                              <Loader2 size={48} className="animate-spin mb-4 text-blue-500" />
                              <p className="text-xl font-bold text-slate-700 mb-2">טוען את המסמך...</p>
                              <p className="text-slate-500 max-w-md">
                                הקובץ נטען ישירות לדפדפן שלך כדי לאפשר תצוגה חלקה. <br/>קבצים גדולים עשויים לקחת מספר שניות.
                              </p>
                            </div>
                          );
                        }
                        
                        if (blobUrl) {
                          return (
                            <div className="relative w-full h-full bg-slate-200">
                              <iframe 
                                src={blobUrl} 
                                className="absolute inset-0 w-full h-full border-none bg-white z-0"
                                title="מציג PDF"
                              />
                              <div className="absolute bottom-6 left-6 z-10">
                                <div className="bg-slate-900/70 hover:bg-slate-900/95 backdrop-blur-md text-white p-2.5 rounded-2xl shadow-2xl border border-slate-700/50 flex items-center gap-3 transition-all opacity-80 hover:opacity-100">
                                  <span className="text-sm font-medium px-2 hidden sm:block opacity-90">
                                    התצוגה ריקה?
                                  </span>
                                  <button 
                                    onClick={() => window.open(blobUrl, '_blank')}
                                    className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-bold transition-colors shadow-sm whitespace-nowrap flex items-center gap-2"
                                  >
                                    פתיחה בחלון נפרד
                                  </button>
                                </div>
                              </div>
                            </div>
                          );
                        }
                        
                        return (
                          <div className="flex flex-col items-center justify-center text-slate-500 p-8 text-center w-full h-full bg-slate-50">
                            <AlertCircle size={48} className="mb-4 text-red-400" />
                            <p className="text-xl font-bold text-slate-700 mb-2">שגיאה בטעינת הקובץ</p>
                            <a href={getDownloadUrl(viewingFile)} target="_blank" rel="noopener noreferrer" className="mt-4 bg-blue-600 text-white px-6 py-2 rounded-lg">
                              פתח בדרופבוקס במקום זאת
                            </a>
                          </div>
                        );
                      } else {
                        return (
                          <div className="flex flex-col items-center justify-center text-slate-500 p-8 text-center w-full h-full bg-slate-50">
                            <File size={64} className="mb-4 text-slate-300" />
                            <p className="text-xl font-bold text-slate-700 mb-2">אין תצוגה מקדימה לקובץ זה</p>
                            <p className="text-slate-500 mb-6 max-w-md">
                              הדפדפן אינו תומך בהצגת קבצי <strong>{ext.toUpperCase()}</strong> ישירות באתר. יש לפתוח או להוריד את הקובץ.
                            </p>
                            <a 
                              href={getDownloadUrl(viewingFile)} 
                              target="_blank" 
                              rel="noopener noreferrer"
                              className="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl transition-all shadow-sm font-medium flex items-center gap-2"
                            >
                              <Download size={20} />
                              פתיחה / הורדה של הקובץ
                            </a>
                          </div>
                        );
                      }
                    })()}
                  </div>
                </div>
              )}

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
