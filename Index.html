<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פורטל לימודים - רזיאל זערור</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f4f6f7;
            --card-bg: #ffffff;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        header {
            margin-bottom: 40px;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        /* Years Container */
        .years-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            max-width: 800px;
            margin: 0 auto 30px auto;
        }

        .year-btn {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .year-btn.active, .year-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        /* Courses Container */
        .courses-container {
            max-width: 800px;
            margin: 0 auto;
            display: none; /* Hidden by default */
        }

        .courses-container.visible {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            animation: fadeIn 0.5s ease;
        }

        .course-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: right;
            border-top: 4px solid var(--accent);
        }

        .course-card h3 {
            margin-top: 0;
            color: var(--primary);
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .links-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .links-list li {
            margin-bottom: 10px;
        }

        .links-list a {
            display: block;
            text-decoration: none;
            color: white;
            background-color: var(--accent);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: background 0.2s;
            text-align: center;
        }

        .links-list a:hover {
            background-color: #2980b9;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <header>
        <h1>הפורטל של רזיאל</h1>
        <p class="subtitle">חומרי לימוד, סיכומים ונוסחאות</p>
    </header>

    <div class="years-grid">
        <button class="year-btn active" onclick="showYear('A')">שנה א'</button>
        <button class="year-btn" onclick="showYear('B')">שנה ב'</button>
        <button class="year-btn" onclick="showYear('C')">שנה ג'</button>
        <button class="year-btn" onclick="showYear('D')">שנה ד'</button>
    </div>

    <div id="year-A" class="courses-container visible">
        
        <div class="course-card">
            <h3>פיזיקה 1</h3>
            <ul class="links-list">
                <li><a href="physics1.html">📄 דף נוסחאות (רזיאל)</a></li>
                </ul>
        </div>

        <div class="course-card">
            <h3>מבוא למדעי המחשב (C)</h3>
            <ul class="links-list">
                <li><a href="c-prog.html">💻 דף נוסחאות - Cheat Sheet</a></li>
            </ul>
        </div>

        <div class="course-card">
            <h3>אלגברה לינארית</h3>
            <ul class="links-list">
                <li><a href="linear-algebra.html">🧮 מאגר שאלות ופתרונות</a></li>
            </ul>
        </div>

    </div>

    <div id="year-B" class="courses-container">
        <div class="course-card">
            <h3>מבני נתונים</h3>
            <p>בקרוב...</p>
        </div>
    </div>

    <div id="year-C" class="courses-container">
        <p>עדיין אין חומרים לשנה זו</p>
    </div>
    
    <div id="year-D" class="courses-container">
        <p>עדיין אין חומרים לשנה זו</p>
    </div>

    <footer>
        נבנה ע"י רזיאל זערור | 2026
    </footer>

    <script>
        function showYear(year) {
            // הסתרת כל השנים
            document.querySelectorAll('.courses-container').forEach(div => {
                div.classList.remove('visible');
            });
            
            // הסרת סימון מהכפתורים
            document.querySelectorAll('.year-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // הצגת השנה שנבחרה
            document.getElementById('year-' + year).classList.add('visible');
            
            // סימון הכפתור שנלחץ (שיטה פשוטה למצוא אותו לפי הטקסט או ה-onclick, כאן פשוט נסמן את הנוכחי)
            event.target.classList.add('active');
        }
    </script>

</body>
</html>
