<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הפורטל של רזיאל</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* איפוס הגדרות בסיסי */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* עיצוב הכותרת */
        header {
            text-align: center;
            margin-bottom: 40px;
            margin-top: 20px;
        }

        h1 {
            color: #2c3e50;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        /* רשת הכרטיסיות */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr; /* בנייד - עמודה אחת */
            gap: 20px;
            width: 100%;
            max-width: 500px; /* רוחב מקסימלי יפה */
        }

        /* עיצוב הכרטיס */
        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .card:active {
            transform: scale(0.98); /* אפקט לחיצה */
        }

        .card-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-box {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }

        .card-text h2 {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        .card-text span {
            font-size: 0.9rem;
            color: #888;
        }

        .arrow {
            color: #ccc;
            font-size: 1.2rem;
        }

        /* צבעים ייחודיים לכל נושא */
        .linear-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .c-bg { background: linear-gradient(135deg, #2af598 0%, #009efd 100%); }
        .phys-bg { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); }
        
        footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 0.8rem;
            color: #aaa;
        }

    </style>
</head>
<body>

    <header>
        <h1>הפורטל של רזיאל</h1>
        <p class="subtitle">כל החומר הלימודי במקום אחד</p>
    </header>

    <div class="grid-container">
        
        <a href="linear.html" class="card">
            <div class="card-content">
                <div class="icon-box linear-bg">
                    <i class="fas fa-calculator"></i>
                </div>
                <div class="card-text">
                    <h2>אלגברה לינארית</h2>
                    <span>תרגול שאלות ופתרונות</span>
                </div>
            </div>
            <i class="fas fa-chevron-left arrow"></i>
        </a>

        <a href="c-lang.html" class="card">
            <div class="card-content">
                <div class="icon-box c-bg">
                    <i class="fas fa-code"></i>
                </div>
                <div class="card-text">
                    <h2>שפת C</h2>
                    <span>נוסחאות וסינטקס</span>
                </div>
            </div>
            <i class="fas fa-chevron-left arrow"></i>
        </a>

        <a href="physics1.html" class="card">
            <div class="card-content">
                <div class="icon-box phys-bg">
                    <i class="fas fa-atom"></i>
                </div>
                <div class="card-text">
                    <h2>פיזיקה 1</h2>
                    <span>דף נוסחאות וסיכומים</span>
                </div>
            </div>
            <i class="fas fa-chevron-left arrow"></i>
        </a>

    </div>

    <footer>
        © 2026 נבנה ע"י רזיאל זערור
    </footer>

</body>
</html>
