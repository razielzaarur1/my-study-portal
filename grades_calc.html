<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון ציונים - רזיאל</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    
    <script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        // Recharts נטען כעת מהגרסה הממוזערת שזמינה בחלון הדפדפן
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, 
            ResponsiveContainer, Cell, PieChart, Pie, AreaChart, 
            Area, ReferenceLine 
        } = window.Recharts; 

        // רכיב עזר לאייקונים
        const Icon = ({ name, className = "", size }) => {
            const icons = {
                Plus: "fa-plus",
                Trash2: "fa-trash-can",
                Calculator: "fa-calculator",
                TrendingUp: "fa-arrow-trend-up",
                Activity: "fa-chart-simple",
                PieIcon: "fa-chart-pie",
                BarIcon: "fa-chart-column",
                Sigma: "fa-square-root-variable"
            };
            return <i className={`fas ${icons[name] || 'fa-circle'} ${className}`} style={{fontSize: size || 'inherit'}}></i>;
        };

        const INITIAL_COURSES = [
            { id: 1, name: 'חדו״א 1', grade: 88, credits: 5.0, active: true },
            { id: 2, name: 'אלגברה ליניארית', grade: 72, credits: 4.5, active: true },
            { id: 3, name: 'מבוא למדעי המחשב', grade: 95, credits: 6.0, active: true },
            { id: 4, name: 'פיזיקה 1', grade: 65, credits: 3.5, active: true },
        ];

        function App() {
            const [courses, setCourses] = useState(INITIAL_COURSES);

            const addCourse = () => {
                const newId = courses.length > 0 ? Math.max(...courses.map(c => c.id)) + 1 : 1;
                setCourses([...courses, { id: newId, name: '', grade: 0, credits: 0, active: true }]);
            };

            const removeCourse = (id) => {
                setCourses(courses.filter(c => c.id !== id));
            };

            const updateCourse = (id, field, value) => {
                setCourses(courses.map(c => 
                    c.id === id ? { ...c, [field]: value } : c
                ));
            };

            const stats = useMemo(() => {
                const activeCourses = courses.filter(c => c.active && c.credits > 0);
                const totalCredits = activeCourses.reduce((sum, c) => sum + Number(c.credits), 0);
                let weightedSum = 0;
                activeCourses.forEach(c => {
                    weightedSum += Number(c.grade) * Number(c.credits);
                });
                const average = totalCredits > 0 ? weightedSum / totalCredits : 0;

                let varianceSum = 0;
                if (totalCredits > 0) {
                    activeCourses.forEach(c => {
                        const diff = Number(c.grade) - average;
                        varianceSum += Number(c.credits) * (diff * diff);
                    });
                }
                const stdDev = totalCredits > 0 ? Math.sqrt(varianceSum / totalCredits) : 0;

                return { totalCredits, average, stdDev, activeCourses };
            }, [courses]);

            const barData = stats.activeCourses.map(c => ({
                name: c.name || 'קורס ללא שם',
                grade: Number(c.grade),
                credits: Number(c.credits)
            }));

            const getBarColor = (grade) => {
                if (grade >= 85) return '#10B981';
                if (grade >= 70) return '#F59E0B';
                return '#EF4444';
            };

            const pieData = stats.activeCourses.map(c => ({
                name: c.name || 'ללא שם',
                value: Number(c.grade) * Number(c.credits)
            }));

            const bellCurveData = useMemo(() => {
                if (stats.activeCourses.length < 2) return [];
                const mean = stats.average;
                const sd = Math.max(stats.stdDev, 5);
                const points = [];
                for (let x = 0; x <= 100; x += 2) {
                    const exponent = -0.5 * Math.pow((x - mean) / sd, 2);
                    const y = (1 / (sd * Math.sqrt(2 * Math.PI))) * Math.exp(exponent);
                    points.push({ x, y: parseFloat(y.toFixed(5)) });
                }
                return points;
            }, [stats.average, stats.stdDev, stats.activeCourses.length]);

            return (
                <div className="min-h-screen p-4 md:p-8">
                    {/* Header */}
                    <header className="mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
                        <div>
                            <h1 className="text-3xl font-bold text-slate-800 flex items-center gap-3">
                                <Icon name="Calculator" className="text-indigo-600" size={32} />
                                מחשבון ציונים אקדמי
                            </h1>
                            <p className="text-slate-500 mt-2 text-lg">ניהול ציונים וניתוח ביצועים בזמן אמת</p>
                        </div>
                        <a href="index.html" className="text-indigo-600 hover:underline font-medium flex items-center gap-2">
                             חזרה לפורטל הראשי <i className="fas fa-arrow-left"></i>
                        </a>
                    </header>

                    {/* Metrics */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col items-center justify-center relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-10">
                                <Icon name="TrendingUp" size={64} className="text-indigo-600" />
                            </div>
                            <h3 className="text-slate-500 font-medium mb-2">ממוצע משוקלל</h3>
                            <span className={`text-5xl font-bold ${stats.average >= 85 ? 'text-emerald-600' : stats.average >= 70 ? 'text-amber-500' : 'text-slate-700'}`}>
                                {stats.average.toFixed(2)}
                            </span>
                        </div>
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col items-center justify-center">
                            <h3 className="text-slate-500 font-medium mb-2">סה"כ נ"ז</h3>
                            <span className="text-5xl font-bold text-slate-700">{stats.totalCredits.toFixed(1)}</span>
                        </div>
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col items-center justify-center">
                            <h3 className="text-slate-500 font-medium mb-2">סטיית תקן</h3>
                            <span className="text-5xl font-bold text-slate-700">{stats.stdDev.toFixed(2)}</span>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 xl:grid-cols-12 gap-8">
                        {/* Table */}
                        <div className="xl:col-span-7 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                            <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-indigo-50/50">
                                <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                    <Icon name="Activity" className="text-indigo-600" />
                                    רשימת קורסים
                                </h2>
                                <button onClick={addCourse} className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition-all text-sm font-medium shadow-sm">
                                    <Icon name="Plus" size={18} /> הוסף קורס
                                </button>
                            </div>
                            <div className="overflow-x-auto p-2">
                                <table className="w-full text-right">
                                    <thead>
                                        <tr className="text-slate-500 text-sm border-b border-slate-100">
                                            <th className="p-4 w-16 text-center">לחישוב?</th>
                                            <th className="p-4">שם הקורס</th>
                                            <th className="p-4 w-32">ציון</th>
                                            <th className="p-4 w-32">נ"ז</th>
                                            <th className="p-4 w-16"></th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-50">
                                        {courses.map((course) => (
                                            <tr key={course.id} className="hover:bg-slate-50 transition-colors">
                                                <td className="p-3 text-center">
                                                    <input type="checkbox" checked={course.active} onChange={(e) => updateCourse(course.id, 'active', e.target.checked)} className="w-5 h-5 accent-indigo-600 cursor-pointer" />
                                                </td>
                                                <td className="p-3">
                                                    <input type="text" value={course.name} onChange={(e) => updateCourse(course.id, 'name', e.target.value)} placeholder="שם הקורס..." className="w-full bg-transparent border-b border-transparent focus:border-indigo-500 outline-none" />
                                                </td>
                                                <td className="p-3">
                                                    <input type="number" min="0" max="100" value={course.grade} onChange={(e) => updateCourse(course.id, 'grade', Math.min(100, Math.max(0, Number(e.target.value))))} className={`w-full text-center rounded-lg border p-1 ${course.grade >= 85 ? 'text-emerald-600 bg-emerald-50 border-emerald-100' : course.grade < 70 ? 'text-rose-600 bg-rose-50 border-rose-100' : 'text-slate-800 border-slate-200'}`} />
                                                </td>
                                                <td className="p-3">
                                                    <input type="number" min="0" step="0.5" value={course.credits} onChange={(e) => updateCourse(course.id, 'credits', Number(e.target.value))} className="w-full text-center rounded-lg border border-slate-200 p-1 text-slate-600" />
                                                </td>
                                                <td className="p-3 text-center">
                                                    <button onClick={() => removeCourse(course.id)} className="text-slate-300 hover:text-rose-500 transition-colors p-2">
                                                        <Icon name="Trash2" size={18} />
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Charts */}
                        <div className="xl:col-span-5 flex flex-col gap-6">
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                                <h3 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-6 flex items-center gap-2">
                                    <Icon name="BarIcon" size={16} /> הישגים לפי קורס
                                </h3>
                                <div className="h-48 w-full">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={barData} layout="horizontal">
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                            <XAxis dataKey="name" hide />
                                            <YAxis domain={[0, 100]} hide />
                                            <Tooltip contentStyle={{borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgba(0,0,0,0.1)'}} />
                                            <Bar dataKey="grade" radius={[4, 4, 0, 0]} barSize={40}>
                                                {barData.map((entry, index) => <Cell key={`cell-${index}`} fill={getBarColor(entry.grade)} />)}
                                            </Bar>
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col">
                                    <h3 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 flex items-center gap-2">
                                        <Icon name="PieIcon" size={16} /> השפעה
                                    </h3>
                                    <div className="h-40 w-full flex-grow">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <PieChart>
                                                <Pie data={pieData} dataKey="value" nameKey="name" cx="50%" cy="50%" innerRadius={30} outerRadius={50} paddingAngle={5}>
                                                    {pieData.map((entry, index) => <Cell key={`cell-${index}`} fill={`hsl(220, 70%, ${50 + (index * 5)}%)`} />)}
                                                </Pie>
                                                <Tooltip />
                                            </PieChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col">
                                    <h3 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 flex items-center gap-2">
                                        <Icon name="Sigma" size={16} /> התפלגות
                                    </h3>
                                    <div className="h-40 w-full flex-grow">
                                        {stats.activeCourses.length > 1 ? (
                                            <ResponsiveContainer width="100%" height="100%">
                                                <AreaChart data={bellCurveData}>
                                                    <defs>
                                                        <linearGradient id="colorGaussian" x1="0" y1="0" x2="0" y2="1">
                                                            <stop offset="5%" stopColor="#6366f1" stopOpacity={0.4}/>
                                                            <stop offset="95%" stopColor="#6366f1" stopOpacity={0}/>
                                                        </linearGradient>
                                                    </defs>
                                                    <Tooltip />
                                                    <Area type="monotone" dataKey="y" stroke="#6366f1" fillOpacity={1} fill="url(#colorGaussian)" />
                                                    <ReferenceLine x={stats.average} stroke="#F59E0B" strokeDasharray="3 3" />
                                                </AreaChart>
                                            </ResponsiveContainer>
                                        ) : (
                                            <div className="h-full flex items-center justify-center text-center text-slate-400 text-xs">נדרשים לפחות 2 קורסים</div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
